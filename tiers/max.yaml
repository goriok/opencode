name: max
providers_used: [copilot, zai, opencode-go]
description: >
  GitHub Copilot Pro+ $39/mo + opencode-go $10/mo + z.ai Max $80/mo = ~$130/mo.
  Claude Opus 4.7 via Copilot Pro+ para agentes primários (sem custo por token).
  Claude Sonnet 4.6 via Copilot para tasks intermediárias.
  z.ai glm-5.1 como fallback soberano (thinking, 203K ctx).
  opencode-go para volume e multimodal.

budget:
  max_usd_month: 130
  notes: >
    GitHub Copilot Pro+: $39/mo, 1500 premium requests/mês (pós jun-2026: 3900 créditos).
    Claude Opus 4.7 via Copilot = sem custo por token dentro do allowance.
    z.ai Coding Plan Max: $80/mo (1600 prompts/5h com glm-5.1 thinking).
    opencode-go: $10/mo flat (fallback e multimodal).
    DeepSeek API não necessária — Copilot + z.ai cobrem todas as faixas de qualidade.

# Estratégia:
# - Claude Opus 4.7 via Copilot para os 4 agentes de reasoning mais críticos
#   (oracle, prometheus, momus, reviewer) — melhor qualidade disponível
# - Claude Sonnet 4.6 via Copilot para sisyphus, coder, librarian, researcher
#   (alta qualidade, menos quota que Opus)
# - z.ai glm-5.1 como fallback primário (thinking, sem Anthropic rate limit)
# - opencode-go kimi-k2.5 como fallback de coding
# - opencode-go mimo-v2-omni para multimodal (único com essa capacidade)
# - opencode-go deepseek-v4-flash para categories rápidas (conserva Copilot quota)

agents:
  sisyphus:
    model: claude-sonnet-4-6
    fallback_models: [zai/glm-5.1, opencode-go/kimi-k2.5]

  oracle:
    model: claude-opus-4-7
    thinking: { type: enabled }
    fallback_models: [zai/glm-5.1, opencode-go/glm-5.1]

  prometheus:
    model: claude-opus-4-7
    thinking: { type: enabled }
    fallback_models: [zai/glm-5.1, opencode-go/glm-5.1]

  metis:
    model: claude-sonnet-4-6
    thinking: { type: enabled }
    fallback_models: [zai/glm-5.1, opencode-go/deepseek-v4-pro]

  momus:
    model: claude-opus-4-7
    thinking: { type: enabled }
    fallback_models: [zai/glm-5.1, opencode-go/glm-5.1]

  explore:
    model: claude-sonnet-4-6
    fallback_models: [zai/glm-5.1, opencode-go/deepseek-v4-flash]

  librarian:
    model: claude-sonnet-4-6
    fallback_models: [zai/glm-4.7, opencode-go/deepseek-v4-flash]

  multimodal-looker:
    model: opencode-go/mimo-v2-omni
    fallback_models: [claude-sonnet-4-6, opencode-go/deepseek-v4-flash]

  researcher:
    model: claude-sonnet-4-6
    fallback_models: [zai/glm-5.1, opencode-go/deepseek-v4-pro]

  coder:
    model: claude-opus-4-7
    fallback_models: [zai/glm-5.1, opencode-go/kimi-k2.5]

  scribe:
    model: claude-sonnet-4-6
    fallback_models: [opencode-go/qwen3.5-plus, zai/glm-4.7]

  reviewer:
    model: claude-opus-4-7
    thinking: { type: enabled }
    fallback_models: [zai/glm-5.1, opencode-go/glm-5.1]

