apiVersion: apps/v1
kind: Deployment
metadata:
  name: $AGENT_NAME
  namespace: $AGENT_NAME
  labels:
    app: $AGENT_NAME
spec:
  replicas: 1
  selector:
    matchLabels:
      app: $AGENT_NAME
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: $AGENT_NAME
    spec:
      serviceAccountName: $AGENT_NAME
      containers:
        - name: $AGENT_NAME
          image: registry.registry.svc.cluster.local:5000/$AGENT_NAME:latest
          imagePullPolicy: Always
          args: ["serve"]
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: LITELLM_API_KEY
              valueFrom:
                secretKeyRef:
                  name: $AGENT_NAME-secret
                  key: LITELLM_API_KEY
            - name: COMPANIONS_URL
              valueFrom:
                secretKeyRef:
                  name: $AGENT_NAME-secret
                  key: COMPANIONS_URL
            - name: COMPANIONS_AGENT_KEY
              valueFrom:
                secretKeyRef:
                  name: $AGENT_NAME-secret
                  key: COMPANIONS_AGENT_KEY
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 30
