name: go-only
providers_used: [opencode-go]
description: >
  Solo opencode-go — $10/mo flat ($60/mo crédito).
  kimi-k2.5 para coding; glm-5.1 para reasoning (via go); flash para volume.
  mimo-v2-omni exclusivo para multimodal. Sem z.ai, Anthropic, ou Copilot.

budget:
  max_usd_month: 10
  notes: >
    opencode-go: $10/mo flat → $12/5h de crédito.
    kimi-k2.5 @ $0.50/Mtok, glm-5.1 @ $0.60/Mtok, flash @ $0.14/Mtok.
    Para uso intenso de coding: preferir kimi-k2.5 + flash para volume.

