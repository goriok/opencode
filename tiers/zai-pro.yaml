name: zai-pro
providers_used: [zai]
description: >
  Solo z.ai Coding Plan Pro — $30/mo, 400 prompts/5h.
  glm-5.1 com thinking para todos os agentes de reasoning e review.
  glm-4.7 (1×) para tasks de baixo custo de quota.

budget:
  max_usd_month: 30
  notes: >
    z.ai Coding Plan Pro: 400 prompts/5h.
    glm-5.1 custa 2× off-peak → use para reasoning crítico.
    glm-4.7 custa 1× → use para volume e tasks rotineiras.

