name: low
description: >
  opencode-go $10/mo + z.ai Coding Plan $10/mo = $20/mo total.
  z.ai entra apenas para reasoning pesado (glm-4.7 com thinking).
  Flash e Qwen para volume. DeepSeek-v4-pro para coding crítico.

budget:
  max_usd_month: 20
  notes: >
    opencode-go: $10/mo flat ($60/mês em crédito).
    z.ai Coding Plan Lite: ~$10/mo (80 prompts/5h, avançados custam 2x off-peak).
    glm-4.7 via Coding Plan: consumo 2x off-peak (equivale ~40 prompts avançados/5h).
    Nenhuma chamada API direta ao z.ai — tudo via Coding Plan.

# Estratégia: z.ai Coding Plan para reasoning (oracle, prometheus, reviewer),
# opencode-go para tudo rotineiro e coding.
# glm-4.7 é o sweet spot do Coding Plan: capaz + menos quota que glm-5.1.
# kimi-k2.5 é o melhor modelo de coding no opencode-go.
# deepseek-v4-flash para volume barato.

agents:
  sisyphus:
    model: opencode-go/deepseek-v4-flash
    fallback_models: [opencode-go/qwen3.5-plus]

  oracle:
    model: zai/glm-4.7
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

  prometheus:
    model: zai/glm-4.7
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/deepseek-v4-pro]

  metis:
    model: opencode-go/deepseek-v4-pro
    thinking: { type: enabled }
    fallback_models: [opencode-go/kimi-k2.5]

  momus:
    model: zai/glm-4.7
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/deepseek-v4-pro]

  explore:
    model: opencode-go/deepseek-v4-flash
    fallback_models: [opencode-go/qwen3.5-plus]

  librarian:
    model: opencode-go/deepseek-v4-flash
    fallback_models: [opencode-go/qwen3.5-plus]

  multimodal-looker:
    model: opencode-go/mimo-v2-omni
    fallback_models: [opencode-go/deepseek-v4-flash]

  researcher:
    model: opencode-go/deepseek-v4-flash
    fallback_models: [opencode-go/qwen3.5-plus]

  coder:
    model: opencode-go/kimi-k2.5
    fallback_models: [opencode-go/deepseek-v4-pro]

  scribe:
    model: opencode-go/deepseek-v4-flash
    fallback_models: [opencode-go/qwen3.5-plus]

  reviewer:
    model: zai/glm-4.7
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

categories:
  writing:
    model: opencode-go/qwen3.5-plus
    fallback_models: [opencode-go/deepseek-v4-flash]

  quick:
    model: opencode-go/deepseek-v4-flash
    fallback_models: []

  unspecified-low:
    model: opencode-go/deepseek-v4-flash
    fallback_models: []

  artistry:
    model: opencode-go/qwen3.5-plus
    fallback_models: [opencode-go/deepseek-v4-flash]

  deep:
    model: zai/glm-4.7
    fallback_models: [opencode-go/deepseek-v4-pro, opencode-go/kimi-k2.5]

  unspecified-high:
    model: opencode-go/deepseek-v4-pro
    fallback_models: [opencode-go/kimi-k2.5]

  visual-engineering:
    model: opencode-go/mimo-v2-omni
    fallback_models: [opencode-go/deepseek-v4-flash]

  ultrabrain:
    model: zai/glm-4.7
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

litellm:
  models:
    - claude-haiku-4-5-20251001
    - gemini/gemini-3.1-flash-lite-preview
