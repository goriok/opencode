apiVersion: v1
kind: ServiceAccount
metadata:
  name: $AGENT_NAME
  namespace: $AGENT_NAME
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: $AGENT_NAME
rules:
  # Read-only — ajustar conforme necessidade do agent
  - apiGroups: [""]
    resources: ["pods", "nodes", "services", "endpoints", "events", "configmaps", "namespaces"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets", "statefulsets", "daemonsets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  # Write em configmaps do próprio namespace (pending_actions)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
    # resourceNames: [] — ou restringir por nome se necessário
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: $AGENT_NAME
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: $AGENT_NAME
subjects:
  - kind: ServiceAccount
    name: $AGENT_NAME
    namespace: $AGENT_NAME
