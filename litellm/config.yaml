litellm_settings:
  # ─── Metrics & Monitoring ──────────────────────────────────────────────────
  callbacks:
    - prometheus

  # ─── Redis Cache ──────────────────────────────────────────────────────────
  # Cache LLM responses para reduzir latency e custo em requests repetidos.
  # Redis roda no container na porta interna 6379 (host:6380).
  # Debug: curl http://localhost:4000/cache/ping -H "Authorization: Bearer $LITELLM_MASTER_KEY"
  cache: true
  cache_params:
    type: redis
    host: os.environ/REDIS_HOST
    port: 6379
    namespace: "litellm.cache"
    ttl: 600                          # 10 min default TTL
    max_connections: 50
  # Virtual key auth cache — compartilha o mesmo Redis entre workers
  enable_redis_auth_cache: true

  # ─── General ──────────────────────────────────────────────────────────────
  drop_params:
    - reasoningSummary
  request_timeout: 120
  # Zero retries global — evita multiplicar 429s do Claude Max OAuth
  # (opencode-go tem limites altos e não precisa de retry agressivo)
  num_retries: 0

router_settings:
  routing_strategy: simple-shuffle
  # Cooldown: após 3 falhas seguidas, pausa o deployment por 5s antes de tentar novamente
  allowed_fails: 3
  cooldown_time: 5
  timeout: 120

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
  store_model_in_db: true
  # Repassa o OAuth token do Claude Max subscription direto para a Anthropic API
  forward_client_headers_to_llm_api: true
