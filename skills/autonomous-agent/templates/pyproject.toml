[project]
name = "$AGENT_NAME"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "openai>=1.58.0",
    "typer>=0.15.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "mem0ai>=0.1.100",
    "fastembed>=0.4.0",
    "qdrant-client>=1.9.0",
    "mcp[cli]>=1.9.0",
    "uvicorn>=0.30.0",
    "starlette>=0.40.0",
    # adicionar deps específicas do agent aqui
]

[project.scripts]
$AGENT_NAME = "$AGENT_MODULE.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/$AGENT_MODULE"]
