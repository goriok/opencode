name: free
providers_used: [opencode-go]
description: >
  Zero custo variável — opencode-go $10/mo cobre tudo via crédito flat.
  Maximiza volume: deepseek-v4-flash (~31k req/5h) para tudo rotineiro,
  glm-5.1 e kimi-k2.5 apenas para reasoning pesado e coding crítico.

budget:
  max_usd_month: 10
  notes: >
    opencode-go: $10/mo flat → $12 de crédito por janela 5h / $60 por mês.
    DeepSeek-v4-flash é o mais barato da plataforma (~31650 req/5h).
    Sem z.ai API direto, sem Anthropic.

# Estratégia: tudo via opencode-go.
# - Flash para volume (explore, scribe, researcher, sisyphus)
# - Pro para coding e reasoning estruturado (coder, deep tasks)
# - glm-5.1 para oracle/reviewer que precisam de thinking real
# - kimi-k2.5 como fallback de coding (forte em código)
# - qwen3.5-plus como fallback de texto (eficiente)
# - mimo-v2-omni exclusivo para multimodal (única opção)

agents:
  sisyphus:
    model: opencode-go/deepseek-v4-flash
    fallback_models: [opencode-go/qwen3.5-plus]

  oracle:
    model: opencode-go/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/kimi-k2.5]

  prometheus:
    model: opencode-go/glm-5.1
