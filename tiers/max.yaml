name: max
description: "Maximum quality (~$200/mo cap). Anthropic Claude Opus for primary agents, zai/glm-5.1 for fast paths."

budget:
  max_usd_month: 200
  notes: "Soft cap applied to LiteLLM-proxied providers (Anthropic, Gemini) only."

