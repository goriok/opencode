name: copilot-lowest
providers_used: [copilot]
description: >
  GitHub Copilot (qualquer plano) — sem consumo de premium requests.
  Usa apenas modelos gratuitos incluídos no plano base: gpt-4o-mini e gemini-2.0-flash-001.
  Ideal para uso ilimitado sem desgaste de quota.

budget:
  max_usd_month: 0
  notes: >
    gpt-4o-mini e gemini-2.0-flash-001 não consomem premium requests no Copilot.
    Zero custo adicional além da assinatura base do Copilot.
    Capacidade limitada vs. modelos Claude — use para tasks rotineiras e volume.

agents:
  sisyphus:
    model: gemini-2.0-flash-001
    fallback_models: [gpt-4o-mini]

