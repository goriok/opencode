name: zai-lite
providers_used: [zai]
description: >
  Solo z.ai Coding Plan Lite — $10/mo, 80 prompts/5h.
  glm-4.7 (1× quota) para tudo. glm-5.1 apenas para reasoning crítico (2× quota).
  Conservar quota é a prioridade.

budget:
  max_usd_month: 10
  notes: >
    z.ai Coding Plan Lite: 80 prompts/5h off-peak.
    glm-5.1 custa 2×: oracle, prometheus, momus, reviewer, ultrabrain.
    Restante usa glm-4.7 (1×) para conservar quota.

