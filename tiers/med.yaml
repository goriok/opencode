name: med
providers_used: [zai, opencode-go]
description: >
  opencode-go $10/mo + z.ai Coding Plan Pro $30/mo = $40/mo total.
  z.ai Pro: 400 prompts/5h — glm-5.1 com thinking para reasoning e review.
  glm-4.7 para tasks balanced. Coding via kimi-k2.5 + deepseek-v4-pro.

budget:
  max_usd_month: 40
  notes: >
    opencode-go: $10/mo flat ($60/mês em crédito, $12/5h).
    z.ai Coding Plan Pro: ~$30/mo (400 prompts/5h; glm-5.1 custa 2x off-peak → ~200 efetivos/5h).
    Sweet spot para uso diário intenso de desenvolvimento.

# Estratégia:
# - z.ai glm-5.1 com thinking para oracle, prometheus, reviewer, momus (análise profunda)
# - z.ai glm-4.7 para sisyphus, explore, librarian, researcher (uso frequente, menor custo quota)
# - opencode-go kimi-k2.5 para coder (melhor coding do go)
# - opencode-go deepseek-v4-pro como fallback robusto
# - opencode-go deepseek-v4-flash para categories rápidas

agents:
  sisyphus:
    model: zai/glm-4.7
    fallback_models: [opencode-go/deepseek-v4-pro, opencode-go/kimi-k2.5]

  oracle:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

  prometheus:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/deepseek-v4-pro]

  metis:
    model: zai/glm-4.7
    thinking: { type: enabled }
    fallback_models: [opencode-go/deepseek-v4-pro, opencode-go/kimi-k2.5]

  momus:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/deepseek-v4-pro]

  explore:
    model: zai/glm-4.7
    fallback_models: [opencode-go/deepseek-v4-flash, opencode-go/qwen3.5-plus]

  librarian:
    model: zai/glm-4.7
    fallback_models: [opencode-go/deepseek-v4-flash, opencode-go/qwen3.5-plus]

  multimodal-looker:
    model: opencode-go/mimo-v2-omni
    fallback_models: [opencode-go/deepseek-v4-flash]

  researcher:
    model: zai/glm-4.7
    fallback_models: [opencode-go/deepseek-v4-flash, opencode-go/qwen3.5-plus]

  coder:
    model: opencode-go/kimi-k2.5
    fallback_models: [opencode-go/deepseek-v4-pro, zai/glm-4.7]

  scribe:
    model: opencode-go/qwen3.5-plus
    fallback_models: [opencode-go/deepseek-v4-flash]

  reviewer:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

categories:
  writing:
    model: opencode-go/qwen3.5-plus
    fallback_models: [opencode-go/deepseek-v4-flash]

  quick:
    model: opencode-go/deepseek-v4-flash
    fallback_models: []

  unspecified-low:
    model: opencode-go/deepseek-v4-flash
    fallback_models: []

  artistry:
    model: zai/glm-4.7
    fallback_models: [opencode-go/qwen3.5-plus]

  deep:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/deepseek-v4-pro, opencode-go/kimi-k2.5]

  unspecified-high:
    model: zai/glm-4.7
    fallback_models: [opencode-go/deepseek-v4-pro, opencode-go/kimi-k2.5]

  visual-engineering:
    model: opencode-go/mimo-v2-omni
    fallback_models: [opencode-go/deepseek-v4-flash]

  ultrabrain:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

litellm:
  models:
    - claude-sonnet-4-6
    - claude-haiku-4-5-20251001
    - gemini/gemini-3.1-flash-lite-preview
    - gemini/gemini-3-flash-preview
    - gemini/gemini-3.1-pro-preview
