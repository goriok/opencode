name: copilot-low
providers_used: [copilot]
description: >
  GitHub Copilot (Pro ou Pro+) — modo economia máxima.
  100% Claude Haiku (0.25 premium req/chamada).
  Ideal para stretching de quota: 300 req/mês Pro → ~1200 chamadas; 1500 req Pro+ → ~6000 chamadas.

budget:
  max_usd_month: 10
  notes: >
    Copilot Pro: $10/mo, ~300 premium req → ~1200 chamadas com Haiku.
    Copilot Pro+: $39/mo, ~1500 premium req → ~6000 chamadas com Haiku.
    Sem Sonnet ou Opus — preserva quota para volume alto.

