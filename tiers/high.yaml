name: high
providers_used: [zai, opencode-go]
description: >
  opencode-go $10/mo + z.ai Coding Plan Max $80/mo + DeepSeek API direto = ~$100/mo.
  z.ai Max: 1600 prompts/5h — glm-5.1 com thinking em tudo que importa.
  DeepSeek v4-pro direto para coding (1M ctx, melhor custo-benefício em API pura).
  GitHub Copilot Pro+ ($39/mo) como alternativa ao Anthropic direto.

budget:
  max_usd_month: 100
  notes: >
    opencode-go: $10/mo flat.
    z.ai Coding Plan Max: $80/mo (1600 prompts/5h; glm-5.1 custa 2x off-peak → ~800 efetivos/5h).
    DeepSeek API direta: v4-pro $0.435/M input (promo), v4-flash $0.14/M input.
    Estimativa: ~$10/mo de DeepSeek para coding pesado (agentes coder/prometheus).
    GitHub Copilot Pro+ ($39/mo) incluso — Claude Opus/Sonnet sem custo por token.

# Estratégia:
# - z.ai glm-5.1 com thinking DOMINANTE: todos agentes de reasoning e review
# - DeepSeek v4-pro direto para coder (1M ctx, promo $0.435/M, melhor custo em API pura)
# - opencode-go kimi-k2.5 como fallback de coding (sem custo API extra)
# - opencode-go deepseek-v4-flash para volume rápido
# - GitHub Copilot Pro+ disponível via litellm (claude-opus-4-7 sem custo por token)

agents:
  sisyphus:
    model: zai/glm-5.1
    fallback_models: [opencode-go/deepseek-v4-pro, opencode-go/kimi-k2.5]

  oracle:
    model: zai/glm-5.1
    thinking: { type: enabled }
    fallback_models: [opencode-go/glm-5.1, opencode-go/kimi-k2.5]

