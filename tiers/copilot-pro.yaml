name: copilot-pro
providers_used: [copilot]
description: >
  Solo GitHub Copilot Pro — $10/mo, ~300 premium requests/mo.
  Claude Sonnet 4.6 para todos os agentes via Copilot (1 premium req/chamada).
  Haiku para tasks de baixo custo de quota (0.25 premium req).

budget:
  max_usd_month: 10
  notes: >
    GitHub Copilot Pro: $10/mo, ~300 premium requests/mo.
    claude-sonnet-4-6 = 1 premium req/chamada.
    claude-haiku-4-5-20251001 = 0.25 premium req/chamada.
    Sem claude-opus-4-7 neste plano (requer Pro+).

