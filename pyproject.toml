[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ocx"
version = "1.0.0"
description = "opencode config CLI — manage agents, LiteLLM proxy, shortcuts, and more"
requires-python = ">=3.10"

dependencies = [
    "typer>=0.12",
    "httpx>=0.27",
    "rich>=13.0",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]


[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0", "typer>=0.12", "pyyaml>=6.0"]

[project.scripts]
ocx = "ocx.cli:app"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ocx*"]
