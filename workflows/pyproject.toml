[project]
name = "session-usage-analyzer"
version = "1.0.0"
description = "Analyzes token consumption in opencode sessions using LiteLLM provider"
readme = "README-session-usage-analyzer.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.24.0",
    "pydantic>=2.0.0",
    "rich>=13.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
]

[project.scripts]
session-usage = "session_usage_analyzer:main"

[tool.black]
line-length = 100
target-version = ['py310']

[tool.mypy]
python_version = "3.10"
strict = true
