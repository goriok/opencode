name: zai-max
providers_used: [zai]
description: >
  Solo z.ai Coding Plan Max — $80/mo, 1600 prompts/5h.
  glm-5.1 com thinking para todos os agentes críticos.
  Quota abundante: pode usar glm-5.1 mais livremente que nos planos menores.

budget:
  max_usd_month: 80
  notes: >
    z.ai Coding Plan Max: 1600 prompts/5h.
    glm-5.1 custa 2× off-peak → ~800 prompts efetivos/5h para thinking.
    Uso intenso: todos os agentes de análise, coding, review em glm-5.1.

