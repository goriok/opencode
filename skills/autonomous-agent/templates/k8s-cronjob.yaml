apiVersion: batch/v1
kind: CronJob
metadata:
  name: $AGENT_NAME-digest
  namespace: $AGENT_NAME
spec:
  schedule: "0 8 * * *"  # 8h diário — ajustar conforme timezone do cluster
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: $AGENT_NAME
          restartPolicy: Never
          containers:
            - name: digest
              image: registry.registry.svc.cluster.local:5000/$AGENT_NAME:latest
              imagePullPolicy: Always
              args: ["digest"]
              env:
                - name: LITELLM_API_KEY
                  valueFrom:
                    secretKeyRef:
                      name: $AGENT_NAME-secret
                      key: LITELLM_API_KEY
                - name: COMPANIONS_URL
                  valueFrom:
                    secretKeyRef:
                      name: $AGENT_NAME-secret
                      key: COMPANIONS_URL
                - name: COMPANIONS_AGENT_KEY
                  valueFrom:
                    secretKeyRef:
                      name: $AGENT_NAME-secret
                      key: COMPANIONS_AGENT_KEY
              resources:
                requests:
                  cpu: "100m"
                  memory: "256Mi"
                limits:
                  cpu: "500m"
                  memory: "512Mi"
